name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Backend lint
        run: npm run api:lint

      - name: Build
        run: npm run build

      - name: Backend build
        run: npm run api:build

      - name: Test
        run: npm test

      - name: Backend test
        run: npm run api:test
